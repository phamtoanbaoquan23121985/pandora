name: Safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run setup safety regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile installer and tests
        run: python -m py_compile setup.py tests/test_setup_safety.py
